<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<title>세계사퀴즈 100</title>
<style>
  /* -----------------------------------------------------------
     세계사퀴즈 100 · 세계 탐험가 여권 콘셉트 (100문항, 이어하기 지원)
     대상: 초등학교 6학년 · 교과: 사회(세계대전과 국제 평화)
  ------------------------------------------------------------*/

  :root{
    --bg: #E4EEF0;
    --surface: #FFFFFF;
    --surface-2: #F3F8F7;
    --line: #D3E1E1;
    --line-strong: #B7CDCE;

    --ink: #1C2E38;
    --ink-soft: #4C6270;
    --ink-faint: #8199A4;

    --accent: #C68E2E;
    --accent-strong: #A9741E;
    --accent-soft: #F3E3BF;

    --ocean: #2E7290;
    --ocean-soft: #DCEBF0;

    --good: #3F9142;
    --good-soft: #E2F3E1;
    --bad: #D3564A;
    --bad-soft: #FBE4E1;

    --shadow: rgba(28,46,56,0.14);

    --font-display: "Jua", "Noto Sans KR", sans-serif;
    --font-body: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    --font-num: "Fredoka", "Noto Sans KR", sans-serif;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #10202A;
      --surface: #16293A;
      --surface-2: #1C3040;
      --line: #2B4453;
      --line-strong: #3C5B6C;

      --ink: #EAF2F5;
      --ink-soft: #A9C0CA;
      --ink-faint: #7C93A0;

      --accent: #E3B75E;
      --accent-strong: #F0CA85;
      --accent-soft: #3A2F17;

      --ocean: #6FB6D6;
      --ocean-soft: #1B3A48;

      --good: #78C97D;
      --good-soft: #1C3324;
      --bad: #E48479;
      --bad-soft: #3A2220;

      --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg: #10202A;
    --surface: #16293A;
    --surface-2: #1C3040;
    --line: #2B4453;
    --line-strong: #3C5B6C;

    --ink: #EAF2F5;
    --ink-soft: #A9C0CA;
    --ink-faint: #7C93A0;

    --accent: #E3B75E;
    --accent-strong: #F0CA85;
    --accent-soft: #3A2F17;

    --ocean: #6FB6D6;
    --ocean-soft: #1B3A48;

    --good: #78C97D;
    --good-soft: #1C3324;
    --bad: #E48479;
    --bad-soft: #3A2220;

    --shadow: rgba(0,0,0,0.4);
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -8%, var(--ocean-soft), transparent 55%),
      radial-gradient(ellipse 800px 500px at 100% 10%, var(--accent-soft), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    padding: clamp(18px, 4vw, 44px) clamp(14px, 4vw, 22px) 56px;
    display: flex;
    justify-content: center;
  }

  h1, h2{ font-family: var(--font-display); font-weight: 400; text-wrap: balance; }
  button{ font-family: inherit; }
  :focus-visible{ outline: 3px solid var(--ocean); outline-offset: 2px; border-radius: 6px; }

  .app{ width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: 18px; }

  .masthead{
    text-align: center;
    padding: 26px 18px 20px;
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: 0 10px 26px var(--shadow);
  }
  .globe-badge{ font-size: 40px; line-height: 1; display: inline-block; margin-bottom: 6px; }
  .masthead h1{ margin: 0 0 4px; font-size: clamp(28px, 6.6vw, 38px); color: var(--accent-strong); }
  .masthead .byline{ margin: 0; font-size: 13.5px; color: var(--ink-faint); letter-spacing: 0.02em; }

  .panel{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px 22px;
    box-shadow: 0 6px 18px var(--shadow);
  }

  /* ---------- start screen ---------- */
  .start-panel{ text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .start-panel p{ margin: 0; color: var(--ink-soft); font-size: 15px; max-width: 46ch; }
  .start-facts{ display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 4px 0 6px; }
  .fact-chip{ font-size: 12.5px; font-weight: 600; color: var(--ocean); background: var(--ocean-soft); border-radius: 999px; padding: 6px 12px; }

  .resume-card{
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    padding: 16px 16px 18px;
    border: 1.5px dashed var(--accent);
    background: var(--accent-soft);
    border-radius: 14px;
  }
  .resume-card p{ margin: 0; font-size: 14px; color: var(--ink); font-weight: 600; }
  .resume-card .resume-sub{ font-weight: 400; color: var(--ink-soft); font-size: 13px; }
  .resume-actions{ display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  .btn{
    padding: 11px 22px;
    border-radius: 999px;
    border: none;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .btn-primary{ color: #fff; background: var(--ocean); }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-ghost{ color: var(--ink-soft); background: var(--surface); border: 1.5px solid var(--line-strong); }
  .btn-ghost:hover{ border-color: var(--ink-faint); color: var(--ink); }

  .start-btn{
    margin-top: 6px;
    padding: 14px 34px;
    font-family: var(--font-display);
    font-size: 19px;
    color: #fff;
    background: linear-gradient(180deg, var(--accent-strong), var(--accent));
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(198,142,46,0.32);
    transition: transform 0.12s ease;
  }
  .start-btn:hover{ transform: translateY(-2px); }
  .start-btn:active{ transform: translateY(0); }

  /* ---------- quiz screen ---------- */
  .quiz-wrap{ display: flex; flex-direction: column; gap: 14px; }

  .progress-row{
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .progress-top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .q-counter{ font-size: 13px; color: var(--ink-faint); font-weight: 600; }
  .score-mini{ font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .score-mini b.g{ color: var(--good); }
  .score-mini b.b{ color: var(--bad); }

  .progress-controls{ display: flex; align-items: center; gap: 8px; }
  .timer{
    font-family: var(--font-num);
    font-size: 15px;
    font-weight: 600;
    color: var(--ocean);
    background: var(--ocean-soft);
    padding: 5px 12px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .timer.low{ color: var(--bad); background: var(--bad-soft); }
  .save-exit{
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--surface-2);
    border: 1.5px solid var(--line-strong);
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .save-exit:hover{ border-color: var(--ocean); color: var(--ocean); }

  .progress-bar-track{
    height: 10px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .progress-bar-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--ocean), var(--accent));
    border-radius: 999px;
    transition: width 0.25s ease;
    width: 0%;
  }

  .question-card{ display: flex; flex-direction: column; gap: 16px; }
  .question-text{
    margin: 0;
    font-size: clamp(18px, 4.4vw, 21px);
    font-weight: 700;
    color: var(--ink);
    text-wrap: balance;
  }

  .choices{ display: flex; flex-direction: column; gap: 10px; }
  .choice-btn{
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    padding: 13px 16px;
    border: 1.5px solid var(--line);
    background: var(--surface-2);
    border-radius: 12px;
    font-size: 15.5px;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease, transform 0.08s ease;
  }
  .choice-btn:hover:not(:disabled){ border-color: var(--ocean); transform: translateX(2px); }
  .choice-btn:disabled{ cursor: default; }
  .choice-letter{
    flex-shrink: 0;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--surface);
    border: 1.5px solid var(--line-strong);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .choice-btn.correct{ border-color: var(--good); background: var(--good-soft); }
  .choice-btn.correct .choice-letter{ background: var(--good); border-color: var(--good); color: #fff; }
  .choice-btn.wrong{ border-color: var(--bad); background: var(--bad-soft); }
  .choice-btn.wrong .choice-letter{ background: var(--bad); border-color: var(--bad); color: #fff; }

  .feedback{
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14.5px;
    animation: slide-in 0.18s ease-out;
  }
  @keyframes slide-in{ from{ opacity: 0; transform: translateY(-4px); } to{ opacity: 1; transform: translateY(0); } }
  .feedback.good{ background: var(--good-soft); color: var(--ink); border: 1px solid var(--good); }
  .feedback.bad{ background: var(--bad-soft); color: var(--ink); border: 1px solid var(--bad); }
  .feedback .fb-title{ font-weight: 800; }
  .feedback.good .fb-title{ color: var(--good); }
  .feedback.bad .fb-title{ color: var(--bad); }

  .next-btn{
    align-self: flex-end;
    padding: 11px 24px;
    border: none;
    border-radius: 999px;
    background: var(--ocean);
    color: #fff;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
  }
  .next-btn:hover{ filter: brightness(1.08); }

  /* ---------- result screen ---------- */
  .result-panel{ text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .medal{ font-size: 56px; line-height: 1; }
  .result-title{ margin: 0; font-family: var(--font-display); font-size: 26px; color: var(--accent-strong); }
  .score-line{ font-family: var(--font-num); font-size: 40px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .score-line span{ color: var(--ink-faint); font-size: 22px; }
  .result-msg{ margin: 0; color: var(--ink-soft); font-size: 14.5px; max-width: 42ch; }
  .retry-btn{
    margin-top: 6px;
    padding: 13px 30px;
    font-family: var(--font-display);
    font-size: 17px;
    color: #fff;
    background: var(--ocean);
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }
  .retry-btn:hover{ filter: brightness(1.08); }

  .result-rank{
    margin: -4px 0 4px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ocean);
    background: var(--ocean-soft);
    padding: 6px 14px;
    border-radius: 999px;
  }

  /* ---------- leaderboard ---------- */
  .leaderboard-panel{ display: flex; flex-direction: column; gap: 12px; }
  .leaderboard-head{ display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .leaderboard-title{ margin: 0; font-family: var(--font-display); font-size: 18px; color: var(--accent-strong); }
  .lb-clear{
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-faint);
    background: none;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 5px 11px;
    cursor: pointer;
  }
  .lb-clear:hover{ color: var(--bad); border-color: var(--bad); }

  .leaderboard-list{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .lb-row{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .lb-row.mine{ border-color: var(--accent); background: var(--accent-soft); }
  .lb-rank{
    flex-shrink: 0;
    width: 30px;
    text-align: center;
    font-family: var(--font-num);
    font-size: 17px;
    color: var(--ink-soft);
  }
  .lb-body{ flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .lb-score{ font-weight: 700; color: var(--ink); font-size: 14.5px; }
  .lb-meta{ font-size: 12px; color: var(--ink-faint); }
  .lb-tag{
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: var(--accent-strong);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .lb-empty{ margin: 0; font-size: 13.5px; color: var(--ink-faint); text-align: center; padding: 8px 0; }

  [hidden]{ display: none !important; }

  @media (prefers-reduced-motion: reduce){
    .feedback, .start-btn, .choice-btn, .progress-bar-fill{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="masthead">
    <span class="globe-badge" aria-hidden="true">🌍</span>
    <h1>세계사퀴즈 100</h1>
    <p class="byline">초등 6학년 사회 · 세계대전과 국제 평화 탐험 (100문항 완전판)</p>
  </header>

  <section class="panel start-panel" id="startPanel">

    <div class="resume-card" id="resumeCard" hidden>
      <p>이어할 수 있는 탐험 기록이 있어요</p>
      <p class="resume-sub" id="resumeInfo"></p>
      <div class="resume-actions">
        <button type="button" class="btn btn-primary" id="resumeBtn">이어하기</button>
        <button type="button" class="btn btn-ghost" id="freshBtn">새로 시작하기</button>
      </div>
    </div>

    <p>제1·2차 세계대전과 우리나라의 광복 이야기를 따라가며 100개의 질문에 도전해보세요. 중간에 멈춰도 언제든 이어서 풀 수 있어요.</p>
    <div class="start-facts">
      <span class="fact-chip">문제 100개</span>
      <span class="fact-chip">5지선다</span>
      <span class="fact-chip">제한시간 60분</span>
      <span class="fact-chip">정답 풀이 제공</span>
      <span class="fact-chip">중간저장 · 이어하기</span>
    </div>
    <button type="button" class="start-btn" id="startBtn">탐험 시작하기 🧭</button>
  </section>

  <section class="panel leaderboard-panel" id="leaderboardPanel">
    <div class="leaderboard-head">
      <h2 class="leaderboard-title">🏆 명예의 전당 (내 최고 기록)</h2>
      <button type="button" class="lb-clear" id="lbClearBtn">기록 초기화</button>
    </div>
    <ol class="leaderboard-list" id="leaderboardList"></ol>
  </section>

  <section class="quiz-wrap" id="quizPanel" hidden>
    <div class="progress-row">
      <div class="progress-top">
        <span class="q-counter" id="qCounter">질문 1 / 100</span>
        <span class="score-mini" id="scoreMini">정답 <b class="g">0</b> · 오답 <b class="b">0</b></span>
        <div class="progress-controls">
          <span class="timer" id="timer">60:00</span>
          <button type="button" class="save-exit" id="saveExitBtn">저장하고 나가기</button>
        </div>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="panel question-card">
      <p class="question-text" id="questionText"></p>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback" hidden></div>
    </div>
  </section>

  <section class="panel result-panel" id="resultPanel" hidden>
    <span class="medal" id="medal"></span>
    <h2 class="result-title" id="resultTitle"></h2>
    <p class="score-line" id="scoreLine"></p>
    <p class="result-msg" id="resultMsg"></p>
    <p class="result-rank" id="resultRank" hidden></p>
    <button type="button" class="retry-btn" id="retryBtn">처음부터 다시 도전하기</button>
  </section>

</div>

<script>
(function(){
  "use strict";

  var QUESTIONS = [
    { q:"제1차 세계대전은 몇 년에 시작되었나요?", choices:["1904년","1910년","1914년","1920년","1930년"], correct:2, explain:"제1차 세계대전은 1914년부터 1918년까지 있었던 전쟁이에요." },
    { q:"제1차 세계대전이 시작되는 계기가 된 사건은?", choices:["사라예보에서 오스트리아 황태자 부부가 암살된 사건","일본의 진주만 공습","노르망디 상륙작전","베를린 장벽 붕괴","무적함대의 침몰"], correct:0, explain:"1914년 사라예보에서 오스트리아·헝가리 황태자 부부가 암살되며 전쟁이 시작됐어요." },
    { q:"제1차 세계대전은 주로 어느 대륙에서 벌어졌나요?", choices:["아프리카","아시아","유럽","오세아니아","남아메리카"], correct:2, explain:"제1차 세계대전은 유럽 여러 나라가 두 편으로 나뉘어 싸운 전쟁이었어요." },
    { q:"제1차 세계대전에서 독일, 오스트리아·헝가리 등이 속한 진영을 무엇이라 부르나요?", choices:["연합국","동맹국","추축국","국제연맹","국제연합"], correct:1, explain:"독일과 오스트리아·헝가리 등은 '동맹국' 진영이었어요." },
    { q:"제1차 세계대전에서 영국, 프랑스, 러시아 등이 속한 진영을 무엇이라 부르나요?", choices:["동맹국","추축국","연합국","국제연맹","코민테른"], correct:2, explain:"영국, 프랑스, 러시아 등은 '연합국' 진영이었어요." },
    { q:"제1차 세계대전은 몇 년에 끝났나요?", choices:["1915년","1916년","1918년","1922년","1925년"], correct:2, explain:"제1차 세계대전은 1918년에 끝났어요." },
    { q:"제1차 세계대전을 공식적으로 끝낸 조약은?", choices:["베르사유 조약","카이로 선언","포츠담 선언","얄타 협정","대서양 헌장"], correct:0, explain:"1919년 베르사유 조약으로 제1차 세계대전이 공식적으로 마무리됐어요." },
    { q:"제1차 세계대전 후 평화를 지키기 위해 만들어진 국제기구는?", choices:["국제연합(UN)","국제연맹","유럽연합(EU)","세계보건기구(WHO)","국제올림픽위원회"], correct:1, explain:"제1차 세계대전 뒤에는 '국제연맹'이 만들어졌지만, 힘이 약해 전쟁을 막지 못했어요." },

    { q:"국제연합 안전보장이사회의 상임이사국이 아닌 나라는?", choices:["미국","영국","프랑스","중국","독일"], correct:4, explain:"상임이사국은 미국, 영국, 프랑스, 러시아, 중국 5개국이며, 독일은 포함되지 않아요." },
    { q:"전쟁이 끝난 뒤 전쟁 범죄를 저지른 사람들을 심판하기 위해 열린 재판으로 알맞은 것은?", choices:["뉘른베르크 재판","베르사유 재판","얄타 재판","카이로 재판","런던 재판"], correct:0, explain:"뉘른베르크 재판에서 전쟁 범죄를 저지른 사람들이 심판을 받았어요." },
    { q:"오늘날에도 세계 평화를 위협하는 요소로 알맞은 것은?", choices:["지역 분쟁과 난민 문제","완전한 세계 평화","전쟁의 완전한 소멸","국제기구의 소멸","특별한 문제 없음"], correct:0, explain:"오늘날에도 여러 지역에서 분쟁과 난민 문제가 이어지고 있어 국제 사회의 노력이 필요해요." },
    { q:"우리가 역사를, 특히 전쟁의 역사를 배우는 가장 중요한 이유는?", choices:["과거의 교훈으로 더 나은 미래를 만들기 위해","시험을 잘 보기 위해","옛날이야기가 재미있어서","어른들이 시켜서","특별한 이유는 없다"], correct:0, explain:"역사를 배우는 것은 과거의 실수를 되풀이하지 않고 더 나은 미래를 만들기 위해서예요." },
    { q:"광복 이후 대한민국 정부가 정식으로 수립된 연도는?", choices:["1945년","1948년","1950년","1953년","1961년"], correct:1, explain:"1948년 8월 15일, 대한민국 정부가 정식으로 수립됐어요." },
    { q:"대한민국의 초대 대통령은 누구인가요?", choices:["김구","이승만","박정희","김대중","안창호"], correct:1, explain:"이승만은 대한민국 정부 수립과 함께 초대 대통령이 되었어요." },
    { q:"오늘날 남북을 나누고 있는 군사 경계선을 무엇이라 부르나요?", choices:["38도선","휴전선","국경선","해안선","경계도로"], correct:1, explain:"6·25 전쟁 이후 휴전선이 남북을 가로지르는 경계가 되었어요. 광복 직후에는 38도선이 기준이었어요." },
    { q:"평화통일을 위해 우리가 가져야 할 마음가짐으로 가장 알맞은 것은?", choices:["서로를 이해하고 대화하려는 노력","무관심","대립과 경쟁만 강조하기","서로의 다름을 무시하기","특별한 노력이 필요 없음"], correct:0, explain:"평화통일을 위해서는 서로를 이해하고 꾸준히 대화하려는 노력이 필요해요." }
  ];

  var TOTAL_TIME = 60 * 60; // 60분
  var SAVE_KEY = 'worldWarQuiz100.progress.v1';
  var HISTORY_KEY = 'worldWarQuiz100.history.v1';
  var lastRecordStamp = null; // dateISO of the attempt just finished, for highlighting

  var order = [], current = 0, score = 0, results = [], timeLeft = TOTAL_TIME, timerId = null, answered = false;

  var els = {
    startPanel: document.getElementById('startPanel'),
    quizPanel: document.getElementById('quizPanel'),
    resultPanel: document.getElementById('resultPanel'),
    startBtn: document.getElementById('startBtn'),
    retryBtn: document.getElementById('retryBtn'),
    resumeCard: document.getElementById('resumeCard'),
    resumeInfo: document.getElementById('resumeInfo'),
    resumeBtn: document.getElementById('resumeBtn'),
    freshBtn: document.getElementById('freshBtn'),
    leaderboardList: document.getElementById('leaderboardList'),
    lbClearBtn: document.getElementById('lbClearBtn'),
    resultRank: document.getElementById('resultRank'),
    qCounter: document.getElementById('qCounter'),
    scoreMini: document.getElementById('scoreMini'),
    progressFill: document.getElementById('progressFill'),
    timer: document.getElementById('timer'),
    saveExitBtn: document.getElementById('saveExitBtn'),
    questionText: document.getElementById('questionText'),
    choices: document.getElementById('choices'),
    feedback: document.getElementById('feedback'),
    medal: document.getElementById('medal'),
    resultTitle: document.getElementById('resultTitle'),
    scoreLine: document.getElementById('scoreLine'),
    resultMsg: document.getElementById('resultMsg')
  };

  function safeGet(key){ try { return window.localStorage.getItem(key); } catch(e){ return null; } }
  function safeSet(key, val){ try { window.localStorage.setItem(key, val); } catch(e){ /* ignore */ } }
  function safeRemove(key){ try { window.localStorage.removeItem(key); } catch(e){ /* ignore */ } }

  function loadSave(){
    var raw = safeGet(SAVE_KEY);
    if (!raw) return null;
    try {
      var data = JSON.parse(raw);
      if (!data || !Array.isArray(data.order) || typeof data.current !== 'number') return null;
      if (data.current >= QUESTIONS.length) return null;
      return data;
    } catch(e){ return null; }
  }

  function persistSave(){
    safeSet(SAVE_KEY, JSON.stringify({ order: order, current: current, score: score, results: results, timeLeft: timeLeft }));
  }

  function clearSave(){ safeRemove(SAVE_KEY); }

  // ---------- personal score history (this browser only) ----------
  function loadHistory(){
    var raw = safeGet(HISTORY_KEY);
    if (!raw) return [];
    try {
      var arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch(e){ return []; }
  }

  function addHistoryRecord(rec){
    var arr = loadHistory();
    arr.push(rec);
    arr.sort(function(a, b){
      if (b.score !== a.score) return b.score - a.score;
      return new Date(b.date) - new Date(a.date);
    });
    arr = arr.slice(0, 30);
    safeSet(HISTORY_KEY, JSON.stringify(arr));
    return arr;
  }

  function formatDate(iso){
    try {
      var d = new Date(iso);
      return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch(e){ return ''; }
  }

  function formatElapsed(sec){
    if (typeof sec !== 'number' || sec < 0) return '';
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + '분 ' + (s < 10 ? '0' + s : s) + '초';
  }

  function renderLeaderboard(){
    var history = loadHistory();
    els.leaderboardList.innerHTML = '';
    if (history.length === 0){
      var empty = document.createElement('p');
      empty.className = 'lb-empty';
      empty.textContent = '아직 기록이 없어요. 첫 탐험을 완료하면 여기에 순위가 쌓여요!';
      els.leaderboardList.appendChild(empty);
      return;
    }
    var medals = ['🥇', '🥈', '🥉'];
    history.slice(0, 10).forEach(function(rec, i){
      var row = document.createElement('li');
      row.className = 'lb-row' + (rec.date === lastRecordStamp ? ' mine' : '');

      var rank = document.createElement('span');
      rank.className = 'lb-rank';
      rank.textContent = medals[i] || String(i + 1);

      var body = document.createElement('span');
      body.className = 'lb-body';
      var scoreEl = document.createElement('span');
      scoreEl.className = 'lb-score';
      scoreEl.textContent = rec.score + ' / ' + rec.total + '문제 정답';
      var metaEl = document.createElement('span');
      metaEl.className = 'lb-meta';
      metaEl.textContent = formatDate(rec.date) + (rec.elapsed != null ? ' · 소요 ' + formatElapsed(rec.elapsed) : '');
      body.appendChild(scoreEl);
      body.appendChild(metaEl);

      row.appendChild(rank);
      row.appendChild(body);

      if (rec.date === lastRecordStamp){
        var tag = document.createElement('span');
        tag.className = 'lb-tag';
        tag.textContent = '방금';
        row.appendChild(tag);
      }

      els.leaderboardList.appendChild(row);
    });
  }

  function refreshResumeUI(){
    var saved = loadSave();
    if (saved){
      els.resumeCard.hidden = false;
      var pct = Math.round((saved.current / QUESTIONS.length) * 100);
      els.resumeInfo.textContent = saved.current + ' / ' + QUESTIONS.length + '문제 진행 (' + pct + '%) · 정답 ' + saved.score + '개';
    } else {
      els.resumeCard.hidden = true;
    }
  }

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function formatTime(sec){
    if (sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
  }

  function startTimer(){
    clearInterval(timerId);
    els.timer.textContent = formatTime(timeLeft);
    els.timer.classList.toggle('low', timeLeft <= 120);
    timerId = setInterval(function(){
      timeLeft--;
      els.timer.textContent = formatTime(timeLeft);
      els.timer.classList.toggle('low', timeLeft <= 120);
      if (timeLeft % 20 === 0) persistSave();
      if (timeLeft <= 0){
        clearInterval(timerId);
        finishQuiz();
      }
    }, 1000);
  }

  function updateProgressUI(){
    els.qCounter.textContent = '질문 ' + (current + 1) + ' / ' + QUESTIONS.length;
    var wrong = results.length - score;
    els.scoreMini.innerHTML = '정답 <b class="g">' + score + '</b> · 오답 <b class="b">' + wrong + '</b>';
    els.progressFill.style.width = Math.round((current / QUESTIONS.length) * 100) + '%';
  }

  function beginSession(fresh){
    if (fresh){
      order = shuffle(QUESTIONS.map(function(_, i){ return i; }));
      current = 0; score = 0; results = []; timeLeft = TOTAL_TIME;
      clearSave();
    }
    answered = false;
    els.startPanel.hidden = true;
    els.resultPanel.hidden = true;
    els.quizPanel.hidden = false;
    startTimer();
    updateProgressUI();
    renderQuestion();
  }

  function renderQuestion(){
    answered = false;
    var qIndex = order[current];
    var q = QUESTIONS[qIndex];

    els.feedback.hidden = true;
    els.feedback.className = 'feedback';
    els.choices.innerHTML = '';
    els.questionText.textContent = q.q;
    updateProgressUI();

    var letters = ['A','B','C','D','E'];
    var indices = shuffle(q.choices.map(function(_, i){ return i; }));

    indices.forEach(function(origIdx, pos){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice-btn';
      btn.setAttribute('data-correct', origIdx === q.correct ? 'true' : 'false');

      var letter = document.createElement('span');
      letter.className = 'choice-letter';
      letter.textContent = letters[pos];

      var label = document.createElement('span');
      label.textContent = q.choices[origIdx];

      btn.appendChild(letter);
      btn.appendChild(label);
      btn.addEventListener('click', function(){ handleAnswer(btn, q); });
      els.choices.appendChild(btn);
    });
  }

  function handleAnswer(btn, q){
    if (answered) return;
    answered = true;

    var isCorrect = btn.getAttribute('data-correct') === 'true';
    var allBtns = els.choices.querySelectorAll('.choice-btn');
    allBtns.forEach(function(b){
      b.disabled = true;
      if (b.getAttribute('data-correct') === 'true') b.classList.add('correct');
    });
    if (!isCorrect) btn.classList.add('wrong');

    if (isCorrect){
      score++;
      results.push('correct');
      els.feedback.classList.add('good');
      els.feedback.innerHTML = '<span class="fb-title">정답이에요! 🎉</span><span>' + q.explain + '</span>';
    } else {
      results.push('wrong');
      els.feedback.classList.add('bad');
      els.feedback.innerHTML = '<span class="fb-title">아쉬워요! 정답은 "' + q.choices[q.correct] + '" 예요.</span><span>' + q.explain + '</span>';
    }

    updateProgressUI();
    persistSave();

    var nextBtn = document.createElement('button');
    nextBtn.type = 'button';
    nextBtn.className = 'next-btn';
    nextBtn.textContent = (current === QUESTIONS.length - 1) ? '결과 보기' : '다음 질문 →';
    nextBtn.addEventListener('click', goNext);
    els.feedback.appendChild(nextBtn);
    els.feedback.hidden = false;
    els.feedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function goNext(){
    current++;
    if (current >= QUESTIONS.length){
      finishQuiz();
    } else {
      persistSave();
      renderQuestion();
    }
  }

  function finishQuiz(){
    clearInterval(timerId);
    clearSave();
    els.quizPanel.hidden = true;
    els.resultPanel.hidden = false;

    els.scoreLine.textContent = score + ' ';
    var span = document.createElement('span');
    span.textContent = '/ ' + QUESTIONS.length;
    els.scoreLine.appendChild(span);

    var elapsed = TOTAL_TIME - Math.max(timeLeft, 0);
    var record = { score: score, total: QUESTIONS.length, date: new Date().toISOString(), elapsed: elapsed };
    lastRecordStamp = record.date;
    var history = addHistoryRecord(record);
    var rankIdx = history.findIndex(function(r){ return r.date === record.date; });
    if (rankIdx > -1){
      els.resultRank.hidden = false;
      els.resultRank.textContent = '내 역대 기록 중 ' + (rankIdx + 1) + '위예요';
    } else {
      els.resultRank.hidden = true;
    }

    var medal, title, msg;
    var pct = score / QUESTIONS.length;
    if (pct >= 0.9){
      medal = '🥇'; title = '세계사 마스터 탐험가!';
      msg = '세계대전의 역사를 정말 잘 알고 있네요. 최고예요!';
    } else if (pct >= 0.7){
      medal = '🥈'; title = '뛰어난 탐험가!';
      msg = '많이 맞혔어요. 틀린 문제만 다시 살펴봐도 완벽해질 거예요.';
    } else if (pct >= 0.5){
      medal = '🥉'; title = '성장하는 탐험가';
      msg = '좋은 출발이에요! 틀린 문제의 설명을 다시 읽어보면 좋아요.';
    } else {
      medal = '🧭'; title = '탐험은 이제 시작!';
      msg = '한 번 더 도전하면서 세계대전 이야기를 알아가 봐요.';
    }
    els.medal.textContent = medal;
    els.resultTitle.textContent = title;
    els.resultMsg.textContent = msg;

    renderLeaderboard();
  }

  function saveAndExit(){
    persistSave();
    clearInterval(timerId);
    els.quizPanel.hidden = true;
    els.resultPanel.hidden = true;
    els.startPanel.hidden = false;
    refreshResumeUI();
  }

  els.startBtn.addEventListener('click', function(){ beginSession(true); });
  els.retryBtn.addEventListener('click', function(){ beginSession(true); });
  els.saveExitBtn.addEventListener('click', saveAndExit);

  els.resumeBtn.addEventListener('click', function(){
    var saved = loadSave();
    if (!saved){ refreshResumeUI(); return; }
    order = saved.order; current = saved.current; score = saved.score;
    results = saved.results || []; timeLeft = (typeof saved.timeLeft === 'number' && saved.timeLeft > 0) ? saved.timeLeft : TOTAL_TIME;
    beginSession(false);
  });

  els.freshBtn.addEventListener('click', function(){
    clearSave();
    refreshResumeUI();
  });

  els.lbClearBtn.addEventListener('click', function(){
    if (window.confirm('저장된 내 기록을 모두 지울까요? 이 작업은 되돌릴 수 없어요.')){
      safeRemove(HISTORY_KEY);
      lastRecordStamp = null;
      renderLeaderboard();
    }
  });

  document.addEventListener('visibilitychange', function(){
    if (document.hidden && !els.quizPanel.hidden) persistSave();
  });
  window.addEventListener('pagehide', function(){
    if (!els.quizPanel.hidden) persistSave();
  });

  refreshResumeUI();
  renderLeaderboard();

})();
</script>
</body>
</html>
