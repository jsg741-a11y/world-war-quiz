<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계대전 탐험 퀴즈</title>
<style>
  :root{
    --navy:#2b1a10;
    --navy-deep:#1a0f09;
    --star:#f2c14e;
    --comet:#7fc9a5;
    --pink:#ff6f9c;
    --white:#f8f2e6;
    --panel:#3a2517;
    --panel-line:#6b4a2e;
    --correct:#4ade80;
    --wrong:#ff6f6f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    font-family:'Trebuchet MS','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(242,193,78,0.08) 0, transparent 30%),
      radial-gradient(circle at 85% 15%, rgba(242,193,78,0.06) 0, transparent 30%),
      radial-gradient(circle at 50% 90%, rgba(127,201,165,0.06) 0, transparent 35%),
      linear-gradient(180deg, var(--navy-deep), var(--navy));
    color:var(--white);
    -webkit-tap-highlight-color: transparent;
  }
  .stage{
    max-width:720px;
    margin:0 auto;
    padding:24px 16px 60px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--panel);
    border:2px solid var(--panel-line);
    border-radius:20px;
    padding:14px 22px;
    margin-bottom:22px;
    font-size:20px;
    font-weight:700;
  }
  .topbar .score{
    color:var(--star);
    font-size:24px;
  }
  .topbar .progress{
    color:var(--comet);
  }
  h1{
    text-align:center;
    font-size:clamp(28px,7vw,42px);
    margin:6px 0 4px;
    letter-spacing:1px;
    text-shadow:0 0 18px rgba(255,226,122,0.5);
  }
  .subtitle{
    text-align:center;
    color:#c7cdf0;
    font-size:18px;
    margin-bottom:30px;
  }
  .planet{
    width:120px;
    height:120px;
    margin:10px auto 26px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f7dfa0, #d9a441 55%, #8a5a1e 100%);
    box-shadow:0 0 40px rgba(217,164,65,0.5), inset -14px -14px 30px rgba(0,0,0,0.35);
    animation:float 4s ease-in-out infinite;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:56px;
  }
  @keyframes float{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-14px);}
  }
  .card{
    background:var(--panel);
    border:2px solid var(--panel-line);
    border-radius:24px;
    padding:28px 22px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  .btn-primary{
    display:block;
    width:100%;
    max-width:320px;
    margin:0 auto;
    padding:20px;
    font-size:24px;
    font-weight:800;
    color:var(--navy-deep);
    background:linear-gradient(135deg, var(--star), #ffc266);
    border:none;
    border-radius:18px;
    cursor:pointer;
    box-shadow:0 8px 0 #c99a2e, 0 14px 24px rgba(0,0,0,0.35);
    transition:transform 0.08s ease;
  }
  .btn-primary:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #c99a2e, 0 6px 14px rgba(0,0,0,0.35);
  }
  .btn-secondary{
    display:block;
    width:100%;
    max-width:320px;
    margin:14px auto 0;
    padding:16px;
    font-size:19px;
    font-weight:700;
    color:var(--comet);
    background:transparent;
    border:2px solid var(--comet);
    border-radius:16px;
    cursor:pointer;
    transition:transform 0.08s ease, background 0.15s ease;
  }
  .btn-secondary:active{
    transform:translateY(3px);
  }
  .resume-banner{
    background:rgba(127,201,165,0.12);
    border:2px solid var(--comet);
    border-radius:16px;
    padding:14px 18px;
    font-size:17px;
    line-height:1.5;
    margin-bottom:18px;
    max-width:420px;
  }
  .reset-link{
    background:none;
    border:none;
    color:#c7cdf0;
    font-size:15px;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }
  .save-indicator{
    text-align:center;
    font-size:14px;
    color:#8f98c2;
    margin-top:14px;
    min-height:18px;
  }
  .nickname-input{
    display:block;
    width:100%;
    max-width:320px;
    margin:14px auto 0;
    padding:14px 16px;
    font-size:18px;
    font-family:inherit;
    color:var(--white);
    background:#1c264d;
    border:2px solid var(--panel-line);
    border-radius:14px;
    text-align:center;
  }
  .nickname-input:focus{
    outline:none;
    border-color:var(--comet);
  }
  .privacy-note{
    max-width:340px;
    margin:12px auto 0;
    font-size:14px;
    line-height:1.5;
    color:#9aa2c9;
  }
  .register-status{
    min-height:20px;
    font-size:15px;
    color:var(--comet);
    margin-top:10px;
  }
  .leaderboard-list{
    width:100%;
    max-width:420px;
    margin:8px auto 0;
    text-align:left;
  }
  .lb-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--panel);
    border:2px solid var(--panel-line);
    border-radius:14px;
    padding:12px 16px;
    margin-bottom:10px;
    font-size:18px;
  }
  .lb-rank{
    font-weight:800;
    color:var(--star);
    width:34px;
    flex-shrink:0;
    text-align:center;
    font-size:20px;
  }
  .lb-name{
    flex:1;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .lb-score{
    font-weight:800;
    color:var(--comet);
  }
  .lb-empty{
    color:#9aa2c9;
    font-size:16px;
    text-align:center;
    margin-top:10px;
  }
  .question-text{
    font-size:clamp(22px,5.5vw,28px);
    font-weight:700;
    line-height:1.4;
    margin-bottom:26px;
    text-align:center;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .option-btn{
    font-size:20px;
    font-weight:700;
    padding:20px 18px;
    border-radius:18px;
    border:3px solid var(--panel-line);
    background:#1c264d;
    color:var(--white);
    cursor:pointer;
    text-align:left;
    transition:transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .option-btn:hover:not(:disabled){
    border-color:var(--comet);
    transform:translateY(-2px);
  }
  .option-btn:active:not(:disabled){
    transform:translateY(1px);
  }
  .option-btn:disabled{
    cursor:default;
  }
  .option-btn.correct{
    background:rgba(74,222,128,0.18);
    border-color:var(--correct);
    color:var(--correct);
  }
  .option-btn.wrong{
    background:rgba(255,111,111,0.18);
    border-color:var(--wrong);
    color:var(--wrong);
  }
  .feedback{
    margin-top:22px;
    padding:18px;
    border-radius:16px;
    font-size:18px;
    line-height:1.6;
    display:none;
  }
  .feedback.show{
    display:block;
    animation:pop 0.25s ease;
  }
  @keyframes pop{
    from{opacity:0; transform:scale(0.96);}
    to{opacity:1; transform:scale(1);}
  }
  .feedback.correct-fb{
    background:rgba(74,222,128,0.12);
    border:2px solid var(--correct);
  }
  .feedback.wrong-fb{
    background:rgba(255,111,111,0.12);
    border:2px solid var(--wrong);
  }
  .feedback .fb-title{
    font-weight:800;
    font-size:20px;
    margin-bottom:8px;
  }
  .next-btn{
    margin-top:20px;
    width:100%;
    padding:18px;
    font-size:20px;
    font-weight:800;
    color:var(--navy-deep);
    background:var(--comet);
    border:none;
    border-radius:16px;
    cursor:pointer;
    box-shadow:0 6px 0 #4ba69c;
  }
  .next-btn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #4ba69c;
  }
  .center-screen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    flex:1;
    text-align:center;
  }
  .result-score{
    font-size:clamp(48px,14vw,72px);
    font-weight:900;
    color:var(--star);
    margin:10px 0 6px;
    text-shadow:0 0 24px rgba(255,226,122,0.6);
  }
  .result-msg{
    font-size:20px;
    color:#c7cdf0;
    margin-bottom:30px;
  }
  .medal{
    font-size:64px;
    margin-bottom:6px;
  }
  .hidden{display:none;}
  footer-note{display:none;}
  @media (min-width:600px){
    .options{
      display:grid;
      grid-template-columns:1fr 1fr;
    }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- 시작 화면 -->
  <div id="screen-start" class="center-screen">
    <div class="planet">🌍</div>
    <h1>🏛️ 세계대전 탐험 퀴즈</h1>
    <p class="subtitle">세계를 뒤흔든 두 번의 큰 전쟁, 얼마나 알고 있을까요?<br>100개의 문제를 풀고 세계대전 박사에 도전해보세요!</p>
    <div id="resume-banner" class="resume-banner hidden"></div>
    <button class="btn-primary hidden" id="btn-resume">이어서 풀기</button>
    <button class="btn-primary" id="btn-start">게임 시작하기</button>
    <button class="btn-secondary" id="btn-view-leaderboard-start">🏆 랭킹 보기</button>
  </div>

  <!-- 게임 화면 -->
  <div id="screen-game" class="hidden">
    <div class="topbar">
      <div class="progress" id="progress-label">문제 1 / 5</div>
      <div class="score" id="score-label">점수: 0점</div>
    </div>
    <div class="card">
      <div class="question-text" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <div class="feedback" id="feedback-box">
        <div class="fb-title" id="feedback-title"></div>
        <div id="feedback-explain"></div>
      </div>
      <button class="next-btn hidden" id="btn-next">다음 문제로 →</button>
    </div>
    <div class="save-indicator" id="save-indicator"></div>
    <button class="reset-link" id="btn-reset" style="display:block; margin:10px auto 0;">처음부터 다시 시작</button>
  </div>

  <!-- 결과 화면 -->
  <div id="screen-result" class="center-screen hidden">
    <div class="medal" id="result-medal">🏆</div>
    <div class="subtitle" style="margin-bottom:0;">최종 점수</div>
    <div class="result-score" id="final-score">0점</div>
    <div class="result-msg" id="result-msg"></div>

    <input type="text" id="nickname-input" class="nickname-input" maxlength="12" placeholder="별명을 입력하세요 (예: 우주여행자)">
    <p class="privacy-note">실명 대신 재미있는 별명을 사용해주세요. 등록하면 이 별명과 점수가 이 퀴즈를 하는 다른 모든 학생에게 공개돼요.</p>
    <button class="btn-secondary" id="btn-register-score">랭킹에 등록하기</button>
    <div class="register-status" id="register-status"></div>

    <button class="btn-primary" id="btn-restart">다시 시작하기</button>
    <button class="btn-secondary" id="btn-view-leaderboard-result">🏆 랭킹 보기</button>
  </div>

  <!-- 랭킹 화면 -->
  <div id="screen-leaderboard" class="center-screen hidden">
    <div class="medal">🏆</div>
    <h1 style="font-size:clamp(24px,6vw,32px);">랭킹 TOP 10</h1>
    <div class="leaderboard-list" id="leaderboard-list"></div>
    <button class="btn-primary" id="btn-leaderboard-back">처음 화면으로</button>
  </div>

</div>

<script>
(function(){
  const questions = [
    {
      q: "1914년부터 1918년까지 여러 유럽 나라가 두 편으로 나뉘어 싸운 전쟁을 무엇이라고 부를까요?",
      options: ["제1차 세계대전", "임진왜란", "십자군 전쟁", "남북전쟁"],
      answerIndex: 0,
      explain: "제1차 세계대전은 1914년부터 1918년까지 유럽을 중심으로 여러 나라가 두 편으로 나뉘어 싸운 전쟁이에요."
    },
    {
      q: "제1차 세계대전이 시작되는 계기가 된 사건은 무엇일까요?",
      options: ["오스트리아 황태자 암살 사건", "진주만 공습", "노르망디 상륙작전", "베를린 장벽 붕괴"],
      answerIndex: 0,
      explain: "1914년 오스트리아-헝가리 제국의 황태자가 사라예보에서 암살당한 사건이 제1차 세계대전의 도화선이 되었어요."
    },
    {
      q: "제1차 세계대전 당시 군인들이 땅을 깊게 파고 그 안에 숨어 싸운 방식을 무엇이라고 부를까요?",
      options: ["참호전", "기마전", "해상전", "공중전"],
      answerIndex: 0,
      explain: "제1차 세계대전에서는 병사들이 긴 도랑(참호)을 파고 그 안에서 오랫동안 대치하는 참호전이 자주 벌어졌어요."
    },
    {
      q: "제1차 세계대전에서 독일, 오스트리아-헝가리 등이 속한 편을 무엇이라고 불렀을까요?",
      options: ["연합국", "동맹국", "추축국", "중립국"],
      answerIndex: 1,
      explain: "제1차 세계대전에서 독일과 오스트리아-헝가리 등이 속한 편을 동맹국이라고 불렀어요."
    },
    {
      q: "제1차 세계대전에서 영국, 프랑스, 러시아 등이 속한 편을 무엇이라고 불렀을까요?",
      options: ["연합국", "동맹국", "식민국", "중립국"],
      answerIndex: 0,
      explain: "영국, 프랑스, 러시아 등이 함께한 편을 연합국이라고 불렀어요."
    },
    {
      q: "제1차 세계대전은 몇 년에 끝났을까요?",
      options: ["1918년", "1945년", "1905년", "1930년"],
      answerIndex: 0,
      explain: "제1차 세계대전은 1918년, 동맹국의 항복으로 끝이 났어요."
    },
    {
      q: "제1차 세계대전을 끝내기 위해 맺은 조약의 이름은 무엇일까요?",
      options: ["베르사유 조약", "강화도 조약", "포츠담 선언", "한일 병합 조약"],
      answerIndex: 0,
      explain: "1919년 파리 근처 베르사유에서 전쟁을 마무리 짓는 베르사유 조약이 맺어졌어요."
    },
    {
      q: "제1차 세계대전 이후, 세계 평화를 지키기 위해 처음 만들어진 국제기구는 무엇일까요?",
      options: ["국제연맹", "국제연합(UN)", "세계무역기구", "유네스코"],
      answerIndex: 0,
      explain: "제1차 세계대전 이후 다시는 큰 전쟁이 없기를 바라며 국제연맹이라는 기구가 만들어졌어요."
    },
    {
      q: "제1차 세계대전 중 처음으로 전쟁터에 등장한 새로운 무기가 아닌 것은 무엇일까요?",
      options: ["탱크", "독가스", "비행기", "스마트폰"],
      answerIndex: 3,
      explain: "제1차 세계대전 때 탱크, 독가스, 비행기 같은 새로운 무기가 처음 등장했어요. 스마트폰은 훨씬 뒤에 만들어졌어요."
    },
    {
      q: "제1차 세계대전이 일어난 주요 무대는 어느 대륙이었을까요?",
      options: ["유럽", "남아메리카", "오세아니아", "남극"],
      answerIndex: 0,
      explain: "제1차 세계대전은 주로 유럽 대륙에서 벌어졌어요."
    },
    {
      q: "제2차 세계대전은 대략 몇 년부터 몇 년까지 있었던 전쟁일까요?",
      options: ["1592년~1598년", "1910년~1945년", "1939년~1945년", "1950년~1953년"],
      answerIndex: 2,
      explain: "제2차 세계대전은 1939년에 시작되어 1945년에 끝난 전쟁이에요."
    },
    {
      q: "제2차 세계대전은 독일이 어느 나라를 침공하면서 시작되었을까요?",
      options: ["폴란드", "프랑스", "영국", "소련"],
      answerIndex: 0,
      explain: "1939년 9월, 독일이 폴란드를 침공하면서 제2차 세계대전이 시작되었어요."
    },
    {
      q: "제2차 세계대전 당시 독일, 이탈리아, 일본이 속한 편을 무엇이라고 불렀을까요?",
      options: ["연합국", "추축국", "중립국", "식민국"],
      answerIndex: 1,
      explain: "독일, 이탈리아, 일본이 함께한 편을 추축국이라고 불렀어요."
    },
    {
      q: "제2차 세계대전 당시 미국, 영국, 소련, 중국 등이 속한 편을 무엇이라고 불렀을까요?",
      options: ["연합국", "추축국", "동맹국", "중립국"],
      answerIndex: 0,
      explain: "미국, 영국, 소련, 중국 등 여러 나라가 힘을 합친 편을 연합국이라고 불렀어요."
    },
    {
      q: "제2차 세계대전 당시 독일을 이끌며 전쟁을 일으킨 지도자는 누구일까요?",
      options: ["나폴레옹", "히틀러", "링컨", "처칠"],
      answerIndex: 1,
      explain: "히틀러는 제2차 세계대전 당시 독일의 지도자로, 전쟁을 일으키고 많은 사람들에게 큰 고통을 주었어요."
    },

  const POINTS_PER_CORRECT = 10;
  const STORAGE_KEY = 'ww100-progress';

  let currentIndex = 0;
  let score = 0;
  let answered = false;

  const screenStart = document.getElementById('screen-start');
  const screenGame = document.getElementById('screen-game');
  const screenResult = document.getElementById('screen-result');

  const btnStart = document.getElementById('btn-start');
  const btnResume = document.getElementById('btn-resume');
  const btnNext = document.getElementById('btn-next');
  const btnRestart = document.getElementById('btn-restart');
  const btnReset = document.getElementById('btn-reset');
  const resumeBanner = document.getElementById('resume-banner');
  const saveIndicator = document.getElementById('save-indicator');

  const progressLabel = document.getElementById('progress-label');
  const scoreLabel = document.getElementById('score-label');
  const questionText = document.getElementById('question-text');
  const optionsContainer = document.getElementById('options-container');
  const feedbackBox = document.getElementById('feedback-box');
  const feedbackTitle = document.getElementById('feedback-title');
  const feedbackExplain = document.getElementById('feedback-explain');

  const finalScore = document.getElementById('final-score');
  const resultMsg = document.getElementById('result-msg');
  const resultMedal = document.getElementById('result-medal');

  const screenLeaderboard = document.getElementById('screen-leaderboard');
  const nicknameInput = document.getElementById('nickname-input');
  const btnRegisterScore = document.getElementById('btn-register-score');
  const registerStatus = document.getElementById('register-status');
  const btnViewLeaderboardStart = document.getElementById('btn-view-leaderboard-start');
  const btnViewLeaderboardResult = document.getElementById('btn-view-leaderboard-result');
  const btnLeaderboardBack = document.getElementById('btn-leaderboard-back');
  const leaderboardList = document.getElementById('leaderboard-list');

  const LEADERBOARD_KEY = 'ww100-leaderboard';
  let hasRegisteredThisRound = false;

  // ===== 랭킹 (공유 저장소 사용) =====

  async function fetchLeaderboard(){
    try{
      const result = await window.storage.get(LEADERBOARD_KEY, true);
      if(result && result.value){
        const list = JSON.parse(result.value);
        if(Array.isArray(list)) return list;
      }
    }catch(err){
      // 아직 등록된 기록이 없으면 정상적으로 무시해요.
    }
    return [];
  }

  function sanitizeNickname(raw){
    let name = (raw || '').trim();
    name = name.replace(/\s+/g, ' ');
    if(name.length === 0) name = '이름 없는 탐험가';
    if(name.length > 12) name = name.slice(0, 12);
    return name;
  }

  async function submitScore(){
    btnRegisterScore.disabled = true;
    registerStatus.textContent = '등록하는 중...';
    const nickname = sanitizeNickname(nicknameInput.value);
    try{
      const list = await fetchLeaderboard();
      list.push({ name: nickname, score: score, ts: Date.now() });
      list.sort((a, b) => (b.score - a.score) || (a.ts - b.ts));
      const trimmed = list.slice(0, 50);
      await window.storage.set(LEADERBOARD_KEY, JSON.stringify(trimmed), true);
      hasRegisteredThisRound = true;
      registerStatus.textContent = `"${nickname}"님, 랭킹에 등록되었어요! 🎉`;
      renderLeaderboard(trimmed);
    }catch(err){
      registerStatus.textContent = '등록에 실패했어요. 잠시 후 다시 시도해주세요.';
      console.error('랭킹 등록 오류:', err);
    }finally{
      btnRegisterScore.disabled = false;
    }
  }

  function renderLeaderboard(list){
    leaderboardList.innerHTML = '';
    if(!list || list.length === 0){
      leaderboardList.innerHTML = '<div class="lb-empty">아직 등록된 기록이 없어요. 첫 번째로 등록해보세요!</div>';
      return;
    }
    const medals = ['🥇', '🥈', '🥉'];
    list.slice(0, 10).forEach((entry, idx) => {
      const row = document.createElement('div');
      row.className = 'lb-row';
      const rank = document.createElement('div');
      rank.className = 'lb-rank';
      rank.textContent = medals[idx] || String(idx + 1);
      const name = document.createElement('div');
      name.className = 'lb-name';
      name.textContent = entry.name || '이름 없는 탐험가';
      const sc = document.createElement('div');
      sc.className = 'lb-score';
      sc.textContent = `${entry.score}점`;
      row.appendChild(rank);
      row.appendChild(name);
      row.appendChild(sc);
      leaderboardList.appendChild(row);
    });
  }

  async function showLeaderboardScreen(){
    screenStart.classList.add('hidden');
    screenGame.classList.add('hidden');
    screenResult.classList.add('hidden');
    screenLeaderboard.classList.remove('hidden');
    leaderboardList.innerHTML = '<div class="lb-empty">불러오는 중...</div>';
    const list = await fetchLeaderboard();
    renderLeaderboard(list);
  }

  function backFromLeaderboard(){
    screenLeaderboard.classList.add('hidden');
    screenStart.classList.remove('hidden');
  }

  // ===== 저장 / 이어하기 =====

  async function saveProgress(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify({ currentIndex, score }), false);
      if(saveIndicator){
        saveIndicator.textContent = '저장됨 ✓';
        setTimeout(() => { if(saveIndicator) saveIndicator.textContent = ''; }, 1200);
      }
    }catch(err){
      console.error('저장 중 오류가 발생했어요:', err);
    }
  }

  async function clearProgress(){
    try{
      await window.storage.delete(STORAGE_KEY, false);
    }catch(err){
      // 저장된 기록이 없으면 오류가 날 수 있어요. 무시해도 괜찮아요.
    }
  }

  async function checkSavedProgress(){
    try{
      const result = await window.storage.get(STORAGE_KEY, false);
      if(result && result.value){
        const data = JSON.parse(result.value);
        if(data && typeof data.currentIndex === 'number' && data.currentIndex >= 0 && data.currentIndex < questions.length){
          resumeBanner.textContent = `이어서 풀 수 있는 기록이 있어요! (문제 ${data.currentIndex + 1} / ${questions.length}, 점수 ${data.score}점)`;
          resumeBanner.classList.remove('hidden');
          btnResume.classList.remove('hidden');
          btnResume.dataset.savedIndex = String(data.currentIndex);
          btnResume.dataset.savedScore = String(data.score);
        }
      }
    }catch(err){
      // 저장된 기록이 없으면 정상적으로 무시해요.
    }
  }

  // ===== 게임 진행 =====

  function startGame(){
    currentIndex = 0;
    score = 0;
    clearProgress();
    screenStart.classList.add('hidden');
    screenResult.classList.add('hidden');
    screenGame.classList.remove('hidden');
    renderQuestion();
  }

  function resumeGame(){
    currentIndex = parseInt(btnResume.dataset.savedIndex, 10) || 0;
    score = parseInt(btnResume.dataset.savedScore, 10) || 0;
    screenStart.classList.add('hidden');
    screenResult.classList.add('hidden');
    screenGame.classList.remove('hidden');
    renderQuestion();
  }

  function renderQuestion(){
    answered = false;
    const item = questions[currentIndex];
    progressLabel.textContent = `문제 ${currentIndex + 1} / ${questions.length}`;
    scoreLabel.textContent = `점수: ${score}점`;
    questionText.textContent = item.q;

    optionsContainer.innerHTML = '';
    item.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => handleAnswer(idx, btn));
      optionsContainer.appendChild(btn);
    });

    feedbackBox.className = 'feedback';
    feedbackBox.innerHTML = '<div class="fb-title" id="feedback-title"></div><div id="feedback-explain"></div>';
    btnNext.classList.add('hidden');

    saveProgress();
  }

  function handleAnswer(selectedIndex, btnEl){
    if(answered) return;
    answered = true;

    const item = questions[currentIndex];
    const allButtons = optionsContainer.querySelectorAll('.option-btn');
    allButtons.forEach(b => b.disabled = true);

    const isCorrect = selectedIndex === item.answerIndex;

    if(isCorrect){
      btnEl.classList.add('correct');
      score += POINTS_PER_CORRECT;
      scoreLabel.textContent = `점수: ${score}점`;

      feedbackBox.classList.remove('wrong-fb');
      feedbackBox.classList.add('correct-fb', 'show');
      feedbackBox.querySelector('.fb-title').textContent = `🎉 정답이에요! +${POINTS_PER_CORRECT}점`;
      feedbackBox.querySelector('#feedback-explain').textContent = item.explain;
    } else {
      btnEl.classList.add('wrong');
      allButtons[item.answerIndex].classList.add('correct');

      feedbackBox.classList.remove('correct-fb');
      feedbackBox.classList.add('wrong-fb', 'show');
      feedbackBox.querySelector('.fb-title').textContent = `아쉬워요! 정답은 "${item.options[item.answerIndex]}" 예요`;
      feedbackBox.querySelector('#feedback-explain').textContent = item.explain;
    }

    btnNext.classList.remove('hidden');
    saveProgress();
  }

  function nextQuestion(){
    currentIndex++;
    if(currentIndex >= questions.length){
      showResult();
    } else {
      renderQuestion();
    }
  }

  function showResult(){
    screenGame.classList.add('hidden');
    screenResult.classList.remove('hidden');
    finalScore.textContent = `${score}점`;
    clearProgress();

    hasRegisteredThisRound = false;
    nicknameInput.value = '';
    registerStatus.textContent = '';

    const maxScore = questions.length * POINTS_PER_CORRECT;
    if(score === maxScore){
      resultMedal.textContent = '🏆';
      resultMsg.textContent = '완벽해요! 진짜 세계대전 박사네요!';
    } else if(score >= maxScore * 0.6){
      resultMedal.textContent = '🌟';
      resultMsg.textContent = '아주 잘했어요! 역사에 대해 많이 알고 있네요.';
    } else {
      resultMedal.textContent = '📚';
      resultMsg.textContent = '괜찮아요! 다시 도전하면서 더 배워봐요.';
    }
  }

  function resetToStart(){
    const ok = window.confirm('지금까지 푼 기록이 사라져요. 처음부터 다시 시작할까요?');
    if(!ok) return;
    clearProgress();
    screenGame.classList.add('hidden');
    screenResult.classList.add('hidden');
    resumeBanner.classList.add('hidden');
    btnResume.classList.add('hidden');
    screenStart.classList.remove('hidden');
  }

  btnStart.addEventListener('click', startGame);
  btnResume.addEventListener('click', resumeGame);
  btnNext.addEventListener('click', nextQuestion);
  btnRestart.addEventListener('click', startGame);
  btnReset.addEventListener('click', resetToStart);
  btnRegisterScore.addEventListener('click', () => {
    if(hasRegisteredThisRound){
      registerStatus.textContent = '이미 이번 점수는 등록했어요!';
      return;
    }
    submitScore();
  });
  btnViewLeaderboardStart.addEventListener('click', showLeaderboardScreen);
  btnViewLeaderboardResult.addEventListener('click', showLeaderboardScreen);
  btnLeaderboardBack.addEventListener('click', backFromLeaderboard);

  checkSavedProgress();
})();
</script>
</body>
</html>
